<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SKYSTRIKE</title>
  <style>
    :root {
      color-scheme: dark;
      --sky-bottom: #211c45;
      --hud: #62ffa7;
      --amber: #ffc85a;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--sky-bottom);
      font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #game-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: var(--sky-bottom);
    }
    #world-canvas,
    #hud-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    #world-canvas {
      z-index: 1;
      cursor: crosshair;
      touch-action: none;
    }
    #hud-canvas {
      z-index: 2;
      pointer-events: none;
    }
    .loading-note {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      color: var(--hud);
      background: rgba(10, 14, 22, 0.7);
      padding: 6px 12px;
      font: 12px "Courier New", monospace;
      letter-spacing: 0.09em;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-root">
    <canvas id="world-canvas"></canvas>
    <canvas id="hud-canvas"></canvas>
    <div class="loading-note">SKYSTRIKE // OFFLINE SYSTEM READY</div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
